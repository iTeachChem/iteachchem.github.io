<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bhagavat Gita Reading</title>
<style>
  :root { --bg:#fbf7ef; --fg:#2a2118; --card:#fff; --line:#e6dcc8; --accent:#b4531f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17130e; --fg:#f1e8d8; --card:#221c14; --line:#3a3125; --accent:#f0a36b; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:2.5rem 16px; }
  h1 { font-size:1.4rem; margin:0 0 1.25rem; }
  a.btn { display:block; box-sizing:border-box; min-height:44px; padding:.8rem 1rem; margin:.6rem 0;
          background:var(--card); border:1px solid var(--line); border-radius:12px;
          color:var(--fg); text-decoration:none; font-weight:600; }
  a.btn:hover, a.btn:focus-visible { border-color:var(--accent); outline:none; }
  a.btn small { display:block; font-weight:400; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Bhagavat Gita Reading</h1>
  <a class="btn" href="https://discord.com/events/1226379612238385242/1386359084420431872">Join the reading on Discord<small>Opens the event. Tap Interested for a reminder.</small></a>
  <a class="btn" href="https://discord.gg/JrNFuCAk2H?event=1386359084420431872">New to the iTeachChem server?<small>Join it here first, then come back for the event</small></a>
  <a class="btn" href="https://www.youtube.com/playlist?list=PL5l36jh8Oss7EPz9YQi4N0qpBbEaYTeZn">Watch on YouTube<small>Playlist</small></a>
</main>
</body>
